groups:
  # Recording rules RED : calculées toutes les 15 s, lues par le dashboard
  - name: taskflow-red
    rules:
      # Rate : requêtes par seconde
      - record: taskflow:http_requests:rate5m
        expr: sum by (env) (rate(http_requests_total{job="taskflow-api"}[5m]))

      # Errors : part des réponses 5xx
      - record: taskflow:http_errors:ratio5m
        expr: |
          sum by (env) (rate(http_requests_total{job="taskflow-api", status_code=~"5.."}[5m]))
          /
          sum by (env) (rate(http_requests_total{job="taskflow-api"}[5m]))

      # Duration : 95e percentile
      - record: taskflow:http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (env, le) (rate(http_request_duration_seconds_bucket{job="taskflow-api"}[5m])))

  - name: taskflow-alertes
    rules:
      - alert: TaskFlowApiDown
        expr: probe_success{job="blackbox-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TaskFlow est injoignable ({{ $labels.env }})"
          description: "La sonde {{ $labels.instance }} échoue depuis plus d'une minute : les utilisateurs ne peuvent plus utiliser l'application."
          runbook_url: "https://github.com/emidesa/taskflow/blob/main/docs/DEPLOIEMENT.md"

      - alert: TaskFlowMetricsDown
        expr: up{job="taskflow-api"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Métriques de l'API illisibles ({{ $labels.env }})"
          description: "Prometheus ne peut plus collecter {{ $labels.instance }} depuis plus d'une minute."
          runbook_url: "https://github.com/emidesa/taskflow/blob/main/docs/DEPLOIEMENT.md"

      - alert: TaskFlowHighErrorRate
        expr: taskflow:http_errors:ratio5m > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreur 5xx élevé ({{ $labels.env }})"
          description: "{{ $value | humanizePercentage }} des requêtes échouent depuis 5 minutes (seuil : 5 %)."
          runbook_url: "https://github.com/emidesa/taskflow/blob/main/docs/DEPLOIEMENT.md"

      - alert: TaskFlowHighLatency
        expr: taskflow:http_request_duration_seconds:p95_5m > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 dégradée ({{ $labels.env }})"
          description: "p95 = {{ $value | humanizeDuration }} depuis 5 minutes (objectif : 300 ms)."
          runbook_url: "https://github.com/emidesa/taskflow/blob/main/docs/DEPLOIEMENT.md"

      # Toujours active : prouve que toute la chaîne d'alerte fonctionne
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerte toujours active : la chaîne d'alerte fonctionne"
