name: IaC

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  schedule:
    - cron: "0 6 * * 1" # chaque lundi : détection de dérive
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  validate:
    name: iac-validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -lockfile=readonly
      - run: tofu validate

  plan:
    name: iac-plan
    needs: validate
    # Jamais de PR venant d'un fork sur le runner du lab (socket Docker)
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lab]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tofu init (state dans STAGING_DIR)
        run: tofu init -lockfile=readonly -backend-config="path=$STAGING_DIR/terraform.tfstate"

      - name: Variables OpenTofu (version déjà déployée)
        run: ./ci-env.sh

      - name: tofu plan
        id: plan
        run: |
          set +e
          tofu plan -no-color -lock-timeout=120s -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 1 ]; then echo "::error::tofu plan a échoué"; exit 1; fi
          tofu show -no-color tfplan > plan.txt
          rm -f tfplan # contient les secrets en clair

      - name: Plan dans le résumé
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            echo "### Plan OpenTofu : staging"
            echo
            echo "**$(grep -E '^(Plan:|No changes\.)' plan.log | tail -n 1)**"
            echo
            echo "<details><summary>Plan complet</summary>"
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo "</details>"
          } | tee plan.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXITCODE" = 2 ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::error::Dérive détectée : le staging ne correspond plus au code"; exit 1
          fi

      - name: Commenter la PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- iac-plan -->';
            const body = `${marker}\n${fs.readFileSync('infra/plan.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Nettoyer
        if: always()
        run: rm -f tfplan plan.txt plan.log plan.md
