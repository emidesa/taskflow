name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  COVERAGE_MIN: 75

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérifier le format (Prettier)
        run: npm run format:check

      - name: Tests unitaires et couverture
        run: npm run test:coverage

      - name: Résumé et seuil de couverture
        run: |
          fichier=coverage/coverage-summary.json
          {
            echo "### Couverture de l'API (Node ${{ matrix.node }})"
            echo ""
            echo "| Mesure | % |"
            echo "|---|---|"
            echo "| Lignes | $(jq -r '.total.lines.pct' $fichier) % |"
            echo "| Instructions | $(jq -r '.total.statements.pct' $fichier) % |"
            echo "| Fonctions | $(jq -r '.total.functions.pct' $fichier) % |"
            echo "| Branches | $(jq -r '.total.branches.pct' $fichier) % |"
          } >> "$GITHUB_STEP_SUMMARY"

          lignes=$(jq -r '.total.lines.pct' $fichier)
          if awk -v p="$lignes" -v min="$COVERAGE_MIN" 'BEGIN { exit !(p < min) }'; then
            echo "::error title=Couverture insuffisante::lignes $lignes % < $COVERAGE_MIN %"
            exit 1
          fi

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow
    defaults:
      run:
        working-directory: api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests d'intégration (PostgreSQL)
        run: npm run test:int

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérifier le format (Prettier)
        run: npm run format:check

      - name: Tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Publier l'artefact front-dist
        uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist
          retention-days: 7
          if-no-files-found: error
